# Extract USPS tracking codes from incoming e-mail and register them
# with `usps.track_parcel`, so parcels start tracking the moment the
# shipping confirmation lands in your inbox — no manual entry.
#
# Requirements:
#   - one or more core IMAP config entries with "text" enabled under
#     "message data" and the max message size raised (carrier mails are
#     long) — full setup guide and pitfalls: track_parcels_from_email.md
#   - optional: an `ai_task` entity for the AI fallback branch; delete
#     the whole `else:` block if you don't use one
#   - PRIVACY: by default this fires on EVERY incoming mail and (with the
#     AI branch) can send mail bodies to your AI Task. Scope the IMAP
#     search to the carrier's sender first — see "Scope & privacy" in the .md.
#
# The regex is deliberately written without backslashes (`(?<![0-9A-Za-z])`
# instead of `\b`, `[0-9]` instead of `\d`): Jinja treats `\b` inside a
# string literal as a backspace escape, so the pattern would silently
# never match.

alias: "USPS: track from e-mail"
description: >-
  Listens to imap_content events from all IMAP entries. Fast regex path for
  USPS tracking codes; optional AI fallback for mails whose layout the
  regex does not recognise.
mode: queued
max: 10

triggers:
  - trigger: event
    event_type: imap_content

variables:
  sender: "{{ trigger.event.data.sender | default('') | lower }}"
  subject: "{{ trigger.event.data.subject | default('') }}"
  body: "{{ trigger.event.data.text | default('') }}"
  content: "{{ subject ~ ' ' ~ body }}"
  # USPS has no short, stable alpha prefix like some other carriers — its
  # domestic IMpb codes are 20-22 all-digit numbers, commonly starting with
  # 9400/9205/9270/9407/9500/9303, and international mail uses the 13-char
  # S10 format (2 letters + 9 digits + 2-letter country code, e.g.
  # "LZ123456785US"). Add your own prefix to the alternation if you see a
  # different one.
  usps_codes: >-
    {{ content | regex_findall('(?<![0-9A-Za-z])(?:9\d{19}|9\d{21}|[A-Z]{2}\d{9}[A-Z]{2})(?![0-9A-Za-z])')
       | unique | list }}
  # Keyword gate for the AI fallback — localise to your language(s).
  is_parcel_mail: >-
    {{ content | lower is search('package|shipped|out for delivery|track|shipment|delivery') }}

conditions:
  # initial=true means "new message"; false means a duplicate trigger of
  # the SAME message (e.g. after a reconnect) — requiring it is free dedup.
  - condition: template
    value_template: "{{ trigger.event.data.initial | default(true) }}"
  - condition: template
    value_template: "{{ is_parcel_mail or usps_codes | count > 0 }}"

actions:
  - repeat:
      for_each: "{{ usps_codes }}"
      sequence:
        - action: usps.track_parcel
          data:
            tracking_code: "{{ repeat.item }}"
  - if:
      - condition: template
        value_template: "{{ usps_codes | count > 0 }}"
    then:
      - action: notify.mobile_app_your_phone
        data:
          title: "📦 USPS parcel picked up from mail"
          message: >-
            {{ usps_codes | join(', ') }} (mail from {{ sender }})
    else:
      # ---- Optional AI fallback — delete this block if you have no ai_task entity ----
      - action: ai_task.generate_data
        data:
          task_name: usps-tracking-code-extraction
          entity_id: ai_task.your_ai_task_entity
          instructions: >-
            Below is an e-mail. Determine whether it contains an USPS
            parcel tracking code. USPS domestic codes are 20-22 digit
            numbers commonly starting with 9400/9205/9270/9407, and
            international codes use the 13-character S10 format (2 letters,
            9 digits, 2-letter country code, e.g. "LZ123456785US"). Only
            return a real tracking code, never an order, customer or
            invoice number. If the mail is from a different carrier, answer
            'other'. When in doubt: 'none'.

            Sender: {{ sender }}
            Subject: {{ subject }}
            Body:
            {{ body[:6000] }}
          structure:
            carrier:
              description: Whether an USPS tracking code was found
              required: true
              selector:
                select:
                  options: ["usps", "other", "none"]
            tracking_code:
              description: The tracking code, or empty if none
              required: false
              selector:
                text:
        response_variable: ai_result
      - choose:
          - conditions: "{{ ai_result.data.carrier == 'usps' and (ai_result.data.tracking_code | default('') | trim) != '' }}"
            sequence:
              - action: usps.track_parcel
                data:
                  tracking_code: "{{ ai_result.data.tracking_code | trim }}"
              - action: notify.mobile_app_your_phone
                data:
                  title: "📦 USPS parcel picked up from mail (AI)"
                  message: "{{ ai_result.data.tracking_code | trim }} (mail from {{ sender }})"
          - conditions: "{{ ai_result.data.carrier == 'other' and (ai_result.data.tracking_code | default('') | trim) != '' }}"
            sequence:
              - action: notify.mobile_app_your_phone
                data:
                  title: "📦 Tracking number found – not an USPS parcel"
                  message: "{{ ai_result.data.tracking_code | trim }} (mail from {{ sender }}, subject: {{ subject }})"
